name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/create-ln-app/template/package-lock.json
            packages/create-ln-app/template/frontend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix packages/create-ln-app/template
          npm ci --prefix packages/create-ln-app/template/frontend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The shared files of the other templates must be the same as the files in template/.
      - name: Check the template copies
        run: npm run sync:templates -- --check

  # Packs the CLI and makes a project from each template with --skip-install on Linux, macOS, and Windows.
  # The job does not start the network. Windows runners cannot run Linux containers, and macOS runners have no Docker.
  # DOCKER_HOST is a closed port, so the doctor fails on each OS. The CLI must show the fixes and exit 0.
  # On Linux and macOS, the job also makes a project with install.sh and the packed CLI.
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # The npm package has LF line ends, so the Windows checkout must not change them to CRLF.
      - name: Keep the LF line ends
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack the CLI
        run: npm pack -w create-ln-app --pack-destination "$RUNNER_TEMP"

      - name: Make a project from each template
        working-directory: ${{ runner.temp }}
        env:
          DOCKER_HOST: tcp://127.0.0.1:1
        run: |
          tarball=$(ls create-ln-app-*.tgz)
          for template in react-ts react next-ts; do
            dir="cli-$template"
            npx --yes --package "./$tarball" create-ln-app "$dir" --template "$template" --skip-install | tee "$dir.log"
            if ! grep -q 'do the fixes above first' "$dir.log"; then
              echo "The doctor did not fail for the $template project."
              exit 1
            fi
            for file in package.json .gitignore network/docker-compose.yml; do
              if [ ! -f "$dir/$file" ]; then
                echo "The $template project has no $file."
                exit 1
              fi
            done
          done

      # shellcheck gives the same result on each OS, so only Linux runs it.
      - name: Check the install script
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      # The pipe does the same as curl | bash. On macOS, /bin/bash is Bash 3.2.
      - name: Make a project with the install script
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        env:
          DOCKER_HOST: tcp://127.0.0.1:1
        run: |
          tarball=$(ls create-ln-app-*.tgz)
          cat "$GITHUB_WORKSPACE/install.sh" | CREATE_LN_APP_PACKAGE="$RUNNER_TEMP/$tarball" /bin/bash -s -- install-app --skip-install
          if [ ! -f install-app/package.json ]; then
            echo "The install script did not make the project."
            exit 1
          fi

  # Packs the CLI, makes a project with it, starts the regtest network, and runs the browser steps.
  # The jobs use the default node list (3 LND nodes), 5 LND nodes, 3 CLN nodes, 3 Eclair nodes, and a mix.
  # The mix job writes network/nodes.json with the 3 impls after the CLI makes the project.
  # The react job uses the React JavaScript template. It also checks, lints, and builds the project.
  # The next-ts job uses the Next.js TypeScript template. It also lints, typechecks, and builds the project.
  # The E2E test uses alice and bob, so the mix job also runs the integration test for each node pair.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lnd
            args: ''
          - name: lnd-5-nodes
            args: --nodes 5
          - name: cln
            args: --impl cln
          - name: eclair
            args: --impl eclair
          - name: react
            args: --template react
            js: true
          - name: next-ts
            args: --template next-ts
            checks: true
          - name: mix
            args: ''
            nodes-json: |
              [
                { "name": "alice", "impl": "lnd" },
                { "name": "bob", "impl": "cln" },
                { "name": "carol", "impl": "eclair" }
              ]
            flow-pairs: alice,bob bob,carol alice,carol
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The Chromium headless shell is a download of about 130 MB.
      - name: Install the browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Make a project with the packed CLI
        run: |
          npm pack -w create-ln-app --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npx --yes --package "$RUNNER_TEMP"/create-ln-app-*.tgz create-ln-app e2e-app ${{ matrix.args }}

      # The JavaScript project must have no TypeScript file and no tsconfig file.
      - name: Check the JavaScript project
        if: matrix.js
        working-directory: ${{ runner.temp }}/e2e-app
        run: |
          ts_files=$(find . -name node_modules -prune -o \( -name '*.ts' -o -name '*.tsx' -o -name 'tsconfig*' \) -print)
          if [ -n "$ts_files" ]; then
            echo "The JavaScript project has TypeScript files:"
            echo "$ts_files"
            exit 1
          fi
          npm run lint
          npm run build

      - name: Check the project
        if: matrix.checks
        working-directory: ${{ runner.temp }}/e2e-app
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Write the node list
        if: matrix.nodes-json
        working-directory: ${{ runner.temp }}/e2e-app
        env:
          NODES_JSON: ${{ matrix.nodes-json }}
        run: |
          printf '%s' "$NODES_JSON" > network/nodes.json
          cat network/nodes.json

      - name: Start the network
        working-directory: ${{ runner.temp }}/e2e-app
        run: npm run network

      - name: Run the E2E test
        env:
          LAPP_DIR: ${{ runner.temp }}/e2e-app
        run: npm run test:e2e

      # Each run of the integration test does the payment flow in the 2 directions.
      - name: Run the integration test for each node pair
        if: matrix.flow-pairs
        working-directory: ${{ runner.temp }}/e2e-app
        env:
          FLOW_PAIRS: ${{ matrix.flow-pairs }}
        run: |
          for pair in $FLOW_PAIRS; do
            echo "Node pair: $pair"
            FLOW_NODES="$pair" npm run test:integration
          done

      - name: Show the network logs
        if: failure()
        working-directory: ${{ runner.temp }}/e2e-app
        run: docker compose -f network/docker-compose.yml logs --tail 200

      - name: Upload the test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.name }}
          path: e2e/test-results/
