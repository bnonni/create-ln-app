name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/create-ln-app/template/package-lock.json
            packages/create-ln-app/template/frontend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix packages/create-ln-app/template
          npm ci --prefix packages/create-ln-app/template/frontend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The shared files of the other templates must be the same as the files in template/.
      - name: Check the template copies
        run: npm run sync:templates -- --check

  # Packs the CLI, makes a project with it, starts the regtest network, and runs the browser steps.
  # The jobs use the default node list (3 LND nodes), 5 LND nodes, 3 CLN nodes, 3 Eclair nodes, and a mix.
  # The mix job writes network/nodes.json with the 3 impls after the CLI makes the project.
  # The react job uses the React JavaScript template. It also checks, lints, and builds the project.
  # The next-ts job uses the Next.js TypeScript template. It also lints, typechecks, and builds the project.
  # The E2E test uses alice and bob, so the mix job also runs the integration test for each node pair.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lnd
            args: ''
          - name: lnd-5-nodes
            args: --nodes 5
          - name: cln
            args: --impl cln
          - name: eclair
            args: --impl eclair
          - name: react
            args: --template react
            js: true
          - name: next-ts
            args: --template next-ts
            checks: true
          - name: mix
            args: ''
            nodes-json: |
              [
                { "name": "alice", "impl": "lnd" },
                { "name": "bob", "impl": "cln" },
                { "name": "carol", "impl": "eclair" }
              ]
            flow-pairs: alice,bob bob,carol alice,carol
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The Chromium headless shell is a download of about 130 MB.
      - name: Install the browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Make a project with the packed CLI
        run: |
          npm pack -w create-ln-app --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npx --yes --package "$RUNNER_TEMP"/create-ln-app-*.tgz create-ln-app e2e-app ${{ matrix.args }}

      # The JavaScript project must have no TypeScript file and no tsconfig file.
      - name: Check the JavaScript project
        if: matrix.js
        working-directory: ${{ runner.temp }}/e2e-app
        run: |
          ts_files=$(find . -name node_modules -prune -o \( -name '*.ts' -o -name '*.tsx' -o -name 'tsconfig*' \) -print)
          if [ -n "$ts_files" ]; then
            echo "The JavaScript project has TypeScript files:"
            echo "$ts_files"
            exit 1
          fi
          npm run lint
          npm run build

      - name: Check the project
        if: matrix.checks
        working-directory: ${{ runner.temp }}/e2e-app
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Write the node list
        if: matrix.nodes-json
        working-directory: ${{ runner.temp }}/e2e-app
        env:
          NODES_JSON: ${{ matrix.nodes-json }}
        run: |
          printf '%s' "$NODES_JSON" > network/nodes.json
          cat network/nodes.json

      - name: Start the network
        working-directory: ${{ runner.temp }}/e2e-app
        run: npm run network

      - name: Run the E2E test
        env:
          LAPP_DIR: ${{ runner.temp }}/e2e-app
        run: npm run test:e2e

      # Each run of the integration test does the payment flow in the 2 directions.
      - name: Run the integration test for each node pair
        if: matrix.flow-pairs
        working-directory: ${{ runner.temp }}/e2e-app
        env:
          FLOW_PAIRS: ${{ matrix.flow-pairs }}
        run: |
          for pair in $FLOW_PAIRS; do
            echo "Node pair: $pair"
            FLOW_NODES="$pair" npm run test:integration
          done

      - name: Show the network logs
        if: failure()
        working-directory: ${{ runner.temp }}/e2e-app
        run: docker compose -f network/docker-compose.yml logs --tail 200

      - name: Upload the test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.name }}
          path: e2e/test-results/
