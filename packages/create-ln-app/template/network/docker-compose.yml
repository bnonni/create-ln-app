# Generated from nodes.json. Do not edit. To change the nodes, edit network/nodes.json and run: npm run compose
# Local regtest network: 1 bitcoind and 3 Lightning nodes (alice lnd, bob lnd, carol lnd).
# Node data goes to ./data/ (ignored in git).
name: lapp-template

x-lnd: &lnd
  image: polarlightning/lnd:0.20.0-beta
  restart: unless-stopped
  environment:
    USERID: ${USERID:-1000}
    GROUPID: ${GROUPID:-1000}
  depends_on:
    bitcoind:
      condition: service_healthy
  healthcheck:
    # The health check runs as root, so it gives lncli the LND dir.
    # For manual calls, run `docker compose exec -u lnd <node> lncli -n regtest ...`.
    test: ['CMD', 'lncli', '--lnddir=/home/lnd/.lnd', '-n', 'regtest', 'getinfo']
    interval: 2s
    timeout: 5s
    retries: 60
  expose:
    - '8080'
    - '10009'
    - '9735'

services:
  bitcoind:
    image: polarlightning/bitcoind:30.0
    restart: unless-stopped
    environment:
      USERID: ${USERID:-1000}
      GROUPID: ${GROUPID:-1000}
    hostname: bitcoind
    command: >-
      bitcoind -server=1 -regtest=1
      -rpcauth=polaruser:5e5e98c21f5c814568f8b55d83b23c1c$$066b03f92df30b11de8e4b1b1cd5b1b4281aa25205bd57df9be82caf97a05526
      -zmqpubrawblock=tcp://0.0.0.0:28334 -zmqpubrawtx=tcp://0.0.0.0:28335
      -zmqpubhashblock=tcp://0.0.0.0:28336
      -txindex=1 -dnsseed=0 -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0
      -rpcport=18443 -rest -listen=1 -listenonion=0 -fallbackfee=0.0002
    volumes:
      - ./data/bitcoind:/home/bitcoin/.bitcoin
    healthcheck:
      test: ['CMD', 'bitcoin-cli', '-regtest', '-rpcuser=polaruser', '-rpcpassword=polarpass', 'getblockchaininfo']
      interval: 2s
      timeout: 5s
      retries: 30
    expose:
      - '18443'
      - '18444'
      - '28334'
      - '28335'
      - '28336'
    ports:
      - '18443:18443'
      - '19444:18444'
      - '28334:28334'
      - '29335:28335'

  alice:
    <<: *lnd
    hostname: alice
    command: >-
      lnd --noseedbackup --trickledelay=5000 --alias=alice --externalip=alice
      --tlsextradomain=alice --tlsextraip=127.0.0.1
      --listen=0.0.0.0:9735 --rpclisten=0.0.0.0:10009 --restlisten=0.0.0.0:8080
      --bitcoin.regtest --bitcoin.node=bitcoind
      --bitcoind.rpchost=bitcoind --bitcoind.rpcuser=polaruser
      --bitcoind.rpcpass=polarpass
      --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
    volumes:
      - ./data/alice:/home/lnd/.lnd
    ports:
      - '8081:8080'
      - '10001:10009'
      - '9735:9735'

  bob:
    <<: *lnd
    hostname: bob
    command: >-
      lnd --noseedbackup --trickledelay=5000 --alias=bob --externalip=bob
      --tlsextradomain=bob --tlsextraip=127.0.0.1
      --listen=0.0.0.0:9735 --rpclisten=0.0.0.0:10009 --restlisten=0.0.0.0:8080
      --bitcoin.regtest --bitcoin.node=bitcoind
      --bitcoind.rpchost=bitcoind --bitcoind.rpcuser=polaruser
      --bitcoind.rpcpass=polarpass
      --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
    volumes:
      - ./data/bob:/home/lnd/.lnd
    ports:
      - '8082:8080'
      - '10002:10009'
      - '9736:9735'

  carol:
    <<: *lnd
    hostname: carol
    command: >-
      lnd --noseedbackup --trickledelay=5000 --alias=carol --externalip=carol
      --tlsextradomain=carol --tlsextraip=127.0.0.1
      --listen=0.0.0.0:9735 --rpclisten=0.0.0.0:10009 --restlisten=0.0.0.0:8080
      --bitcoin.regtest --bitcoin.node=bitcoind
      --bitcoind.rpchost=bitcoind --bitcoind.rpcuser=polaruser
      --bitcoind.rpcpass=polarpass
      --bitcoind.zmqpubrawblock=tcp://bitcoind:28334
      --bitcoind.zmqpubrawtx=tcp://bitcoind:28335
    volumes:
      - ./data/carol:/home/lnd/.lnd
    ports:
      - '8083:8080'
      - '10003:10009'
      - '9737:9735'
